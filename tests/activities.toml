# The catalog the tests run against: a general-purpose panel with thirteen activities
# and the free-form button. The guild's own panel is ../activities.toml, which its
# officers edit freely; nothing in the tests depends on what that one says.
#
# Languages: every text has an `en` and an `es` version. English is required;
# a missing Spanish text falls back to the English one.


# --- Sign-up roles -----------------------------------------------------------
# The buttons under an announcement. An activity lists the ones it wants in
# `roles`; an empty list means no sign-up buttons at all.

[roles.tank]
emoji = "🛡️"
en = "Tank"
es = "Tanque"

[roles.healer]
emoji = "💚"
en = "Healer"
es = "Healer"

[roles.dps]
emoji = "⚔️"
en = "DPS"
es = "DPS"

[roles.support]
emoji = "✨"
en = "Support"
es = "Soporte"

[roles.scout]
emoji = "🔭"
en = "Scout"
es = "Scout"

[roles.going]
emoji = "✅"
en = "I'm in"
es = "Voy"


# --- Free-form announcement ----------------------------------------------------
# The last button on the panel: the caller writes the title and the message.
# Delete this table to remove the button.

[custom]
emoji = "📢"
color = "#5865F2"
style = "secondary"
roles = []
en = "Custom announcement"
es = "Anuncio libre"


# --- Activities ----------------------------------------------------------------
# One [[activity]] per panel button, in panel order (five buttons per row, at
# most 24 activities).
#
#   key     short id, lowercase letters/digits/underscore. Don't rename it once
#           announcements exist — it is how a button finds its activity.
#   emoji   shown on the button and in the announcement.
#   color   the announcement's accent colour, as #RRGGBB.
#   style   the button colour: primary (blurple), secondary (grey),
#           success (green) or danger (red).
#   icon    optional thumbnail: an Albion item id (drawn by render.albiononline.com)
#           or a full https:// image URL.
#   roles   sign-up buttons for this activity, from the [roles] above.
#   label   the name on the button and the announcement's title.
#   message the line under the title.

[[activity]]
key = "zvz"
emoji = "⚔️"
color = "#C0392B"
style = "danger"
icon = "T8_MOUNT_MAMMOTH_BATTLE@1"
roles = ["tank", "healer", "dps", "support"]

[activity.en]
label = "ZvZ"
message = "The guild is massing for a ZvZ. Grab your set, get on voice and stay on the caller."

[activity.es]
label = "ZvZ"
message = "El gremio se junta para ZvZ. Trae tu set, entra a voz y pégate al caller."



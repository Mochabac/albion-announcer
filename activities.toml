# --- Free-form announcement ----------------------------------------------------
# An extra last button on the panel: the caller writes the title and the message.
# This guild does not use it. Remove the `# ` from these lines to bring it back.

# [custom]
# emoji = "📢"
# color = "#5865F2"
# style = "secondary"
# roles = []
# en = "Custom announcement"
# es = "Anuncio libre"


# --- Activities ----------------------------------------------------------------
# One [[activity]] per panel button, in panel order (five buttons per row, at
# most 24 activities).
#
#   key     short id, lowercase letters/digits/underscore. Don't rename it once
#           announcements exist — it is how a button finds its activity.
#   emoji   shown on the button and in the announcement.
#   color   the announcement's accent colour, as #RRGGBB.
#   style   the button colour: primary (blurple), secondary (grey),
#           success (green) or danger (red).
#   icon    optional thumbnail: an Albion item id (drawn by render.albiononline.com)
#           or a full https:// image URL.
#   roles   sign-up buttons for this activity, from the [roles] above.
#   label   the name on the button and the announcement's title.
#   message optional: a line under the title.

# Static dungeons.
[[activity]]
key = "limpieza"
emoji = "🧹"
color = "#27AE60"
style = "success"
icon = "T8_2H_INFERNOSTAFF_MORGANA"
roles = ["limpieza_tank", "limpieza_healer", "limpieza_dps1", "limpieza_dps2", "limpieza_support"]

[activity.en]
label = "Limpieza!"


# PvP diving on static dungeons.
[[activity]]
key = "dive"
emoji = "⚔️"
color = "#C0392B"
style = "danger"
icon = "T8_2H_DUALAXE_KEEPER"
roles = ["dive_tank", "dive_healer", "dive_support", "dive_dps1", "dive_dps2"]

[activity.en]
label = "Pelea / Dive (ta buffo)"


# Group dungeon skipping. DPS 2 is optional.
[[activity]]
key = "skip"
emoji = "⏩"
color = "#3498DB"
style = "primary"
icon = "T8_MAIN_CURSEDSTAFF"
roles = ["skip_tank", "skip_healer", "skip_dps1", "skip_dps2"]

[activity.en]
label = "Skip de grupales!"
message = "Se puede llevar mas gente a leechear fama o para limpiar mas rapido"


# Avalonian raid, 8 to 10 players: the five fixed positions plus 3 to 5 falces.
[[activity]]
key = "ava"
emoji = "🌀"
color = "#F1C40F"
style = "secondary"
icon = "T8_2H_AXE_AVALON"
roles = ["ava_maintank", "ava_offtank", "ava_healer", "ava_dps", "ava_support", "ava_falce"]

[activity.en]
label = "Ava Raid"
message = "De 8 a 10 personas. Las falces (de 3 a 5) deben llevar macro e ir por lo menos con un tier 5.4."

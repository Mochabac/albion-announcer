# The activities your guild can announce, and the words the bot uses for them.
#
# Edit freely, then restart the bot and post a fresh panel with /panel (the buttons
# on an old panel keep their old names). `./run.sh --check` validates this file
# without connecting to Discord.
#
# Languages: a text can have an `en` and an `es` version. `en` is required, and it
# is what a missing `es` falls back to. This guild's texts are the same in both
# languages, so each one is written once, under `en`.


# --- Sign-up roles -----------------------------------------------------------
# The buttons under an announcement: one per position in the comp. An activity
# lists the ones it wants in `roles`; an empty list means no sign-up buttons at
# all. Each activity has its own positions here, named <activity>_<position>.
#
#   limit   how many players the position takes. Pressing a free position takes
#           it and puts the player's name next to it; a full one is greyed out.
#           Leave `limit` out for a role anyone can join: it then shows a head
#           count instead.

# Limpieza!

[roles.limpieza_tank]
emoji = "🛡️"
limit = 1
en = "Tank"

[roles.limpieza_healer]
